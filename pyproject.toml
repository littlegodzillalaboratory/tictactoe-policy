[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"

[installer]
no-binary = [ ":none:" ]

[tool.poetry]
name = "tictactoe-policy"
version = "0.9.0-pre.0"
description = "Learned policy for Tic-Tac-Toe game with configurable-size boards"
license = "Apache-2.0"
authors = [ "Little Godzilla Laboratory <blah+lgl@cliffano.com>" ]
readme = "README.md"
homepage = "https://github.com/littlegodzillalaboratory/tictactoe-policy"
repository = "https://github.com/littlegodzillalaboratory/tictactoe-policy"
documentation = "https://github.com/littlegodzillalaboratory/tictactoe-policy"
keywords = [ "tictactoe-policy", "..." ]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[[tool.poetry.packages]]
include = "tictactoe_policy"

[tool.poetry.dependencies]
python = "^3.10"
conflog = "~2.1.0"
PyYAML = "~6.0.2"
torch = ">=2.2,<3"

[tool.poetry.scripts]
tictactoe-policy = "tictactoe_policy.cli:main"

[tool.poetry.group.dev.dependencies]
black = "~25.12.0"
twine = "~6.2.0"
wheel = "~0.45.1"

[tool.poetry.group.test.dependencies]
coverage = "~7.13.0"
numpy = "1.26.4" # https://stackoverflow.com/questions/78634235/numpy-dtype-size-changed-may-indicate-binary-incompatibility-expected-96-from
pylint = "~4.0.4"
pytest = "~9.0.2"
radon = "~6.0.1"

[tool.poetry.group.doc.dependencies]
ansi2html = "~1.9.2"
pylint-report = "~2.4.2"
pytest-html = "~4.1.1"
Sphinx = "8.1.3" # Pinned for Python 3.10 support
